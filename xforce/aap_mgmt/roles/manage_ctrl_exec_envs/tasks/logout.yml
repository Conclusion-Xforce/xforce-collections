---
- name: Delete the authentication token with the token we created
  ansible.platform.token:
    aap_hostname: "{{ platform_host }}"
    aap_token: "{{ aap_token }}"
    existing_token: "{{ aap_token }}"
    state: absent
    validate_certs: "{{ aap_validate_certs }}"
  when: aap_token is defined
