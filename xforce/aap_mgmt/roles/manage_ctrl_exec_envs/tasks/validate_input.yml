---
- name: Check that a controller host is specified
  ansible.builtin.assert:
    that: platform_host | default('') | length
    fail_msg: No platform_host defined; aborting
    success_msg: platform_host set to {{ platform_host }}

- name: Check that a controller admin user is specified
  ansible.builtin.assert:
    that: aap_admin_user | default('') | length
    fail_msg: No aap_admin_user defined; aborting
    success_msg: aap_admin_user set to {{ aap_admin_user }}

- name: Check that a controller admin password is specified
  ansible.builtin.assert:
    that: aap_admin_password | default('') | length
    fail_msg: No aap_admin_password defined; aborting
    success_msg: aap_admin_password defined
