---
# tasks file for manage_hub_collections
- name: Check that a hub host is specified
  ansible.builtin.assert:
    that: platform_host | default('') | length
    fail_msg: "No platform_host defined; aborting"
    success_msg: "platform_host set to {{ platform_host }}"

- name: Check that a hub admin user is specified
  ansible.builtin.assert:
    that: automationhub_admin_user | default('') | length
    fail_msg: "No automationhub_admin_user defined; aborting"
    success_msg: "automationhub_admin_user set to {{ automationhub_admin_user }}"

- name: Check that a hub admin password is specified
  ansible.builtin.assert:
    that: automationhub_admin_password | default('') | length
    fail_msg: "No automationhub_admin_password defined; aborting"
    success_msg: "automationhub_admin_password defined"

- name: Configure all remotes
  ansible.hub.collection_remote:
    ah_host: "{{ platform_host }}"
    ah_username: "{{ automationhub_admin_user }}"
    ah_password: "{{ automationhub_admin_password }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    name: "{{ current_repo.name }}"
    url: "{{ current_repo.url }}"
    auth_url: "{{ current_repo.auth_url | default(omit) }}"
    token: "{{ current_repo.token | default(omit) }}"
    requirements: "{{ current_repo.requirements | default(omit) }}"
    proxy_url: "{{ aap_proxy_url | default(omit) }}"
    proxy_username: "{{ aap_proxy_username | default(omit) }}"
    proxy_password: "{{ aap_proxy_password | default(omit) }}"
    state: "{{ current_repo.state | default('present') }}"
  loop: "{{ aap_collection_repos | default([]) }}"
  loop_control:
    loop_var: current_repo

- name: Configure all repositories
  ansible.hub.collection_repository:
    ah_host: "{{ platform_host }}"
    ah_username: "{{ automationhub_admin_user }}"
    ah_password: "{{ automationhub_admin_password }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    name: "{{ current_repo.name }}"
    remote: "{{ current_repo.name }}"
    state: "{{ current_repo.state | default('present') }}"
    update_repo: true
    wait: "{{ hub_reposync_wait }}"
  loop: "{{ aap_collection_repos | default([]) }}"
  loop_control:
    loop_var: current_repo
