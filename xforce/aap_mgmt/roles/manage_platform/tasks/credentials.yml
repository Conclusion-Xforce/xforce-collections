---
- name: Retrieve authentication token from platform using username/password
  ansible.platform.token:
    aap_hostname: "{{ aap_platform_host }}"
    aap_username: "{{ aap_admin_user }}"
    aap_password: "{{ aap_admin_password }}"
    description: "System-wide token for access to Private Automation Hub collections"
    scope: "read"
    state: present
    aap_validate_certs: "{{ aap_validate_certs | default(true) }}"
  no_log: false

- name: Store the aap_token in a fact for later use
  ansible.builtin.set_fact:
    aap_hub_token: "{{ aap_token.token }}"

- name: Create all credentials on controller
  ansible.controller.credential:
    controller_host: "{{ aap_platform_host }}"
    controller_oauthtoken: "{{ runtime_aap_token }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    name: "{{ item.name }}"
    description: "{{ item.description }}"
    organization: "{{ item.organization }}"
    credential_type: "{{ item.credential_type }}"
    inputs: "{{ item.inputs }}"
    state: present
  loop: "{{ aap_controller_credentials }}"

- name: Create all credentials on EDA controller
  ansible.eda.credential:
    controller_host: "{{ aap_platform_host }}"
    controller_token: "{{ runtime_aap_token.token }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    name: "{{ item.name }}"
    description: "{{ item.description }}"
    organization: "{{ item.organization }}"
    credential_type_name: "{{ item.credential_type }}"
    inputs: "{{ item.inputs }}"
    state: present
  loop: "{{ aap_eda_credentials }}"

- name: "Ensure credential_type {{ current_credential_type.name }} exists"
  ansible.controller.credential_type:
    controller_host: "{{ aap_platform_host }}"
    controller_oauthtoken: "{{ runtime_aap_token }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    name: "{{ current_credential_type.name }}"
    description: "{{ current_credential_type.description | default(omit) }}"
    kind: "{{ current_credential_type.kind }}"
    inputs: "{{ current_credential_type.inputs }}"
    injectors: "{{ current_credential_type.injectors }}"
    state: present
  loop: "{{ custom_credential_types | default([]) }}"
  loop_control:
    loop_var: current_credential_type
