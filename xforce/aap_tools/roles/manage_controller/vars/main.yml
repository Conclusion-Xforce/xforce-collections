---
# vars file for manage_controller
__aap_credential_types: |
  {{ lookup('ansible.controller.controller_api', 'credential_types',
        host=controller_host, oauth_token=controller_token, validate_certs=controller_validate_certs, return_all=true) }}
__aap_credentials: |
  {{ lookup('ansible.controller.controller_api', 'credentials',
        host=controller_host, oauth_token=controller_token, validate_certs=controller_validate_certs, return_all=true) }}
__aap_users: |
  {{ lookup('ansible.controller.controller_api', 'users',
        host=controller_host, oauth_token=controller_token, validate_certs=controller_validate_certs, return_all=true) }}

# System and LDAP Authentication Settings
# The controller_ldap_settings are constructed from the variables in the group_vars/{dev,ota,prd}
controller_ldap_settings:
  - name: AUTH_LDAP_SERVER_URI
    value: "{{ ldap_proto }}://{{ ldap_server }}:{{ ldap_port }}"
  - name: AUTH_LDAP_BIND_DN
    value: "{{ ldap_binddn }}"
  - name: AUTH_LDAP_BIND_PASSWORD
    value: "{{ ldap_bindpw }}"
  - name: AUTH_LDAP_START_TLS
    value: false
  - name: AUTH_LDAP_USER_SEARCH
    value: |
      [
        "{{ ldap_user_ou }}",
        "SCOPE_SUBTREE",
        "(sAMAccountName=%(user)s)"
      ]
  - name: AUTH_LDAP_USER_ATTR_MAP
    value: |
      {
        "email": "mail",
        "last_name": "sn",
        "first_name": "givenName"
      }
  - name: AUTH_LDAP_GROUP_SEARCH
    value: |
      [
        "{{ ldap_group_ou }}",
        "SCOPE_SUBTREE",
        "(objectClass=groupOfNames)"
      ]
  - name: AUTH_LDAP_GROUP_TYPE
    value: "{{ ldap_group_type }}"
  - name: AUTH_LDAP_REQUIRE_GROUP
    value: "{{ ldap_require_group }}"
  - name: AUTH_LDAP_DENY_GROUP
    value: null
  - name: AUTH_LDAP_USER_FLAGS_BY_GROUP
    value: |
      {
        "is_system_auditor": [
            "{{ ldap_auditor_group }}"
        ]
      }
