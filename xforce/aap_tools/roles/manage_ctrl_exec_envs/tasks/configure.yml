---
- name: Get id of credential_type Container Registry
  ansible.builtin.set_fact:
    registry_type_id: "{{ __aap_credential_types | selectattr('namespace', 'eq', 'registry') | map(attribute='id') | first }}"

- name: Get a list of container registry credentials
  ansible.builtin.set_fact:
    container_credential: "{{ __aap_credentials | selectattr('credential_type', 'eq', registry_type_id | int) | first }}"

- name: Add the execution environments to the controller
  ansible.controller.execution_environment:
    controller_host: "{{ controller_host }}"
    controller_oauthtoken: "{{ controller_token }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    name: "{{ current_ee.name }}"
    description: "{{ current_ee.description }}"
    image: "{{ hub_host }}/{{ current_ee.namespace }}/{{ current_ee.image }}:{{ current_ee.tag | default('latest') }}"
    credential: "{{ container_credential.name }}"
    state: "present"
  loop: "{{ hub_ee_images }}"
  loop_control:
    loop_var: current_ee
    label: "{{ current_ee.image }}"
