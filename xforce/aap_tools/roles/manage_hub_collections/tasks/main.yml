---
# tasks file for manage_hub_collections
- name: Check that a hub host is specified
  ansible.builtin.assert:
    that: hub_host | default('') | length
    fail_msg: "No hub_host defined; aborting"
    success_msg: "hub_host set to {{ hub_host }}"

- name: Check that a hub admin user is specified
  ansible.builtin.assert:
    that: aap_admin_user | default('') | length
    fail_msg: "No aap_admin_user defined; aborting"
    success_msg: "aap_admin_user set to {{ aap_admin_user }}"

- name: Check that a hub admin password is specified
  ansible.builtin.assert:
    that: aap_admin_password | default('') | length
    fail_msg: "No aap_admin_password defined; aborting"
    success_msg: "aap_admin_password defined"

- name: Check that the Red Hat token is specified
  ansible.builtin.assert:
    that: hub_redhat_token | default('') | length
    fail_msg: "No hub_redhat_token defined; aborting"
    success_msg: "hub_redhat_token defined with length {{ hub_redhat_token | length }}"

- name: Configure all remotes
  infra.ah_configuration.collection_remote:
    ah_host: "{{ hub_host }}"
    ah_username: "{{ aap_admin_user }}"
    ah_password: "{{ aap_admin_password }}"
    validate_certs: "{{ hub_validate_certs | default(true) }}"
    name: "{{ current_repo.name }}"
    url: "{{ current_repo.url }}"
    auth_url: "{{ current_repo.auth_url | default(omit) }}"
    token: "{{ current_repo.token | default(omit) }}"
    requirements: "{{ current_repo.requirements | default(omit) }}"
    proxy_url: "{{ hub_proxy_url | default(omit) }}"
    proxy_username: "{{ hub_proxy_username | default(omit) }}"
    proxy_password: "{{ hub_proxy_password | default(omit) }}"
    state: present
  loop: "{{ hub_remote_repos }}"
  loop_control:
    loop_var: current_repo

- name: Configure all repositories
  infra.ah_configuration.collection_repository:
    ah_host: "{{ hub_host }}"
    ah_username: "{{ aap_admin_user }}"
    ah_password: "{{ aap_admin_password }}"
    validate_certs: "{{ hub_validate_certs | default(true) }}"
    name: "{{ current_repo.name }}"
    remote: "{{ current_repo.name }}"
    state: present
    update_repo: true
    wait: "{{ hub_reposync_wait }}"
  loop: "{{ hub_remote_repos }}"
  loop_control:
    loop_var: current_repo
